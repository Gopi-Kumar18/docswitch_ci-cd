server {
    # Nginx inside container listens on 80
    listen 80;
    server_name _;

    # Serve Vite/React build
    root /usr/share/nginx/html;
    index index.html;

    # Handle large document uploads
    client_max_body_size 200M;

    # ---------- Reverse Proxy for Backend ----------
    # All API calls go to backend container / service
    location /api/ {

        # Docker / Docker-Compose / internal network
        # proxy_pass http://backend:3000;

        # Render backend (recommended for your case)
        proxy_pass https://docswitch-backend.onrender.com;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # ---------- Static SPA Routing ----------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---------- Static Asset Caching ----------
    location ~* \.(js|css|png|jpg|jpeg|svg|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
}
